<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Sign Dashboard | 追星銷量監控</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .event-list {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .event-item {
            padding: 16px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            cursor: pointer;
            transition: background 0.2s;
            flex-wrap: wrap;
        }
        .event-item:hover {
            background: #fafafa;
        }
        .event-item:last-child {
            border-bottom: none;
        }
        .info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .platform-tag {
            font-size: 12px;
            color: #666;
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            width: fit-content;
        }
        .event-name {
            font-size: 16px;
            font-weight: 500;
        }
        .sales-info {
            text-align: right;
        }
        .sales-number {
            font-size: 20px;
            font-weight: bold;
            color: #111;
        }
        .sales-unit {
            font-size: 12px;
            color: #888;
        }
        .countdown {
            font-size: 12px;
            margin-top: 4px;
            font-weight: bold;
        }
        /* 狀態顏色 */
        .status-active { color: #1e8e3e; } /* 綠色 */
        .status-ended { color: #d93025; }  /* 紅色 */
        .status-upcoming { color: #f29900; } /* 黃色 */
        
        /* 展開的詳細紀錄區塊 */
        .details-panel {
            display: none;
            width: 100%;
            background: #fafafa;
            padding: 16px 0 0 0;
            margin-top: 16px;
            font-size: 14px;
            color: #666;
            border-top: 1px dashed #ddd;
        }
        .details-panel.active {
            display: block;
        }
        .history-item {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 Fan Sign Dashboard</h1>
    <input type="text" class="search-box" placeholder="搜尋場次名稱或平台...">
    
    <div class="event-list" id="event-list">
        
        <!-- 場次 1：藝聲（已結束） -->
        <div class="event-item" onclick="toggleDetails(this)">
            <div class="info">
                <span class="platform-tag">ALL MY DAY</span>
                <span class="event-name">YESUNG 藝聲 應募活動</span>
            </div>
            <div class="sales-info">
                <div class="sales-number">298 <span class="sales-unit">本</span></div>
                <div class="countdown status-ended">🔴 應募結束</div>
            </div>
            <div class="details-panel">
                <div style="font-weight:bold; margin-bottom:8px;">📈 歷史紀錄：</div>
                <div class="history-item">11/02 23:59 ▶ 總數 298 (最終數字)</div>
            </div>
        </div>

        <!-- 場次 2：SUNGHANBIN（應募中） -->
        <div class="event-item" onclick="toggleDetails(this)">
            <div class="info">
                <span class="platform-tag">ALL MY DAY</span>
                <span class="event-name">SUNGHANBIN 高雄簽售</span>
            </div>
            <div class="sales-info">
                <div class="sales-number">0 <span class="sales-unit">本</span></div>
                <div class="countdown status-active">🟢 應募中 (剩 5 天)</div>
            </div>
            <div class="details-panel">
                <div style="font-weight:bold; margin-bottom:8px;">📈 歷史紀錄：</div>
                <div class="history-item">11/04 15:00 ▶ 等待第一筆訂單...</div>
            </div>
        </div>

    </div>
</div>

<script>
    // 點擊卡片展開/收起詳細資訊的邏輯
    function toggleDetails(element) {
        const panel = element.querySelector('.details-panel');
        if (panel) {
            panel.classList.toggle('active');
        }
    }
</script>

</body>
</html>
