<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Sign Dashboard | 追星銷量監控</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .event-list {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .event-item {
            padding: 16px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            cursor: pointer;
            transition: background 0.2s;
            flex-wrap: wrap;
        }
        .event-item:hover {
            background: #fafafa;
        }
        .event-item:last-child {
            border-bottom: none;
        }
        .info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .platform-tag {
            font-size: 12px;
            color: #666;
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            width: fit-content;
        }
        .event-name {
            font-size: 16px;
            font-weight: 500;
        }
        .sales-info {
            text-align: right;
        }
        .sales-number {
            font-size: 20px;
            font-weight: bold;
            color: #111;
        }
        .sales-unit {
            font-size: 12px;
            color: #888;
        }
        .countdown {
            font-size: 12px;
            margin-top: 4px;
            font-weight: bold;
            color: #1e8e3e;
        }
        
        /* 展開的詳細紀錄區塊 */
        .details-panel {
            display: none;
            width: 100%;
            background: #fafafa;
            padding: 16px 0 0 0;
            margin-top: 16px;
            font-size: 14px;
            color: #666;
            border-top: 1px dashed #ddd;
            max-height: 200px;
            overflow-y: auto;
        }
        .details-panel.active {
            display: block;
        }
        .history-item {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .loading {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 Fan Sign Dashboard</h1>
    <input type="text" id="search" class="search-box" placeholder="搜尋場次名稱或平台...">
    
    <div class="event-list" id="event-list">
        <div class="loading">資料載入中，請稍候...</div>
    </div>
</div>

<script>
    let globalData = [];
    let historyData = [];

    // 1. 初始化，去抓 GitHub 上的 data.json
    async function loadData() {
        try {
            // 加上時間戳記避免瀏覽器快取
            const res = await fetch('data.json?t=' + new Date().getTime());
            const db = await res.json();
            
            historyData = db.history || [];
            const latest = db.latest || {};

            // 整理要顯示的資料
            const eventsMap = {};
            historyData.forEach(item => {
                // 如果這個場次還沒被加進地圖，就初始化
                if (!eventsMap[item.name]) {
                    eventsMap[item.name] = {
                        name: item.name,
                        platform: item.platform || "ALL MY DAY", // 預設平台
                        total: 0,
                        history: []
                    };
                }
                // 把歷史紀錄塞進去（最新的在上面）
                eventsMap[item.name].history.unshift(item);
            });

            // 更新總數為最新的數字
            for (let name in eventsMap) {
                const histories = eventsMap[item.name];
                if (histories && histories.history.length > 0) {
                    eventsMap[name].total = histories.history[0].total;
                }
            }

            globalData = Object.values(eventsMap);
            
            // 如果歷史紀錄是空的，就先放個假資料擋著，避免畫面全空
            if (globalData.length === 0) {
                globalData = [
                    { name: "YESUNG 藝聲 應募活動", platform: "ALL MY DAY", total: 941, history: [{time: "11/02 23:59", total: 941, change: 0}] },
                    { name: "SUNGHANBIN 高雄簽售", platform: "ALL MY DAY", total: 0, history: [{time: "11/04 15:00", total: 0, change: 0}] }
                ];
            }

            renderList(globalData);
        } catch (e) {
            console.error("讀取失敗", e);
            document.getElementById('event-list').innerHTML = '<div class="loading" style="color:red">資料讀取失敗，請重整網頁</div>';
        }
    }

    // 2. 渲染首頁列表
    function renderList(data) {
        const listEl = document.getElementById('event-list');
        listEl.innerHTML = '';

        if (data.length === 0) {
            listEl.innerHTML = '<div class="loading">找不到符合的場次</div>';
            return;
        }

        data.forEach((event, index) => {
            // 判斷狀態（這裡簡化，未來可以寫更精確的時間判斷）
            const isEnded = event.name.includes("藝聲"); // 簡單示範
            const statusClass = isEnded ? "status-ended" : "status-active";
            const statusText = isEnded ? "🔴 應募結束" : "🟢 應募中";

            const div = document.createElement('div');
            div.className = 'event-item';
            div.onclick = () => toggleDetails(div);

            // 產生歷史紀錄的 HTML
            let historyHtml = '';
            event.history.forEach(h => {
                const changeColor = h.change > 0 ? '#1e8e3e' : (h.change < 0 ? '#d93025' : '#666');
                const changeText = h.change > 0 ? `+${h.change}` : h.change;
                historyHtml += `<div class="history-item">
                    <span>${h.time}</span>
                    <span>總數 ${h.total} <span style="color:${changeColor}; font-weight:bold;">(${changeText})</span></span>
                </div>`;
            });

            div.innerHTML = `
                <div class="info">
                    <span class="platform-tag">${event.platform}</span>
                    <span class="event-name">${event.name}</span>
                </div>
                <div class="sales-info">
                    <div class="sales-number">${event.total} <span class="sales-unit">本</span></div>
                    <div class="countdown ${statusClass}">${statusText}</div>
                </div>
                <div class="details-panel">
                    <div style="font-weight:bold; margin-bottom:8px;">📈 歷史紀錄：</div>
                    ${historyHtml}
                </div>
            `;
            listEl.appendChild(div);
        });
    }

    // 點擊卡片展開/收起
    function toggleDetails(element) {
        const panel = element.querySelector('.details-panel');
        if (panel) {
            panel.classList.toggle('active');
        }
    }

    // 搜尋功能
    document.getElementById('search').addEventListener('input', function(e) {
        const keyword = e.target.value.toLowerCase();
        const filtered = globalData.filter(item => 
            item.name.toLowerCase().includes(keyword) || 
            item.platform.toLowerCase().includes(keyword)
        );
        renderList(filtered);
    });

    // 頁面載入時執行
    loadData();
    
    // 每 5 分鐘自動重新抓取網頁資料
    setInterval(loadData, 300000);
</script>

</body>
</html>
